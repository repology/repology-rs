[package]
name = "repology-updater"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
strict-parsers = []

[dependencies]
anyhow = "1.0.104"
async-compression = { version = "0.4.43", features = ["gzip", "bzip2", "xz", "zstd", "tokio"] }
async-rayon = "0.1.0"
async-trait = "0.1.92"
bitflags = "2.13.1"
clap = { version = "4.6.4", features = ["derive"] }
faine = { version = "0.2.1", default-features = false }
futures-util = { version = "0.3.33", default-features = false }
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
rayon = "1.12.0"
regex = "1.13.1"
repology-common = { path = "../repology-common" }
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "0.0.27"
serde-xml-rs = "0.8.2"
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
tera = { version = "2.1.0", default-features = false }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = { version = "1.1.4", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"

[dev-dependencies]
insta = "1.48.0"
mockito = "1.7.2"
paste = "1.0.15"
tempfile = "3.27.0"
