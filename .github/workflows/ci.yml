name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
env:
  POSTGRESQL: 17
  RUST: nightly-2026-10-09
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          components: rustfmt,clippy
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      - name: Set up PostgreSQL
        run: |
          sudo pg_dropcluster $POSTGRESQL main --stop || true
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt update
          sudo apt install postgresql-$POSTGRESQL postgresql-server-dev-$POSTGRESQL
          sudo pg_createcluster $POSTGRESQL main
          sudo sed -i -e 's|5433|5432|' /etc/postgresql/$POSTGRESQL/main/postgresql.conf
          sudo sh -c "echo 'local all all trust' > /etc/postgresql/$POSTGRESQL/main/pg_hba.conf"
          sudo sh -c "echo 'host all all samehost trust' >> /etc/postgresql/$POSTGRESQL/main/pg_hba.conf"
          sudo pg_ctlcluster $POSTGRESQL main start
      - name: Test
        run: cargo test
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      - name: Format check
        run: cargo fmt --check
      - name: Clippy check
        run: cargo clippy --all-targets
  build-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      - name: Build as workspace
        run: cargo build
  build-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      - name: Build as individual crates
        run: cargo hack --workspace build
